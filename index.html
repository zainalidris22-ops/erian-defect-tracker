                                        <i className="fa-solid fa-triangle-exclamation text-amber-500"></i> 10 Worst Rooms (Defect Terbanyak)
                                    </h3>
                                    <button onClick={() => setWorstRoomModal(false)} className="text-slate-400 hover:text-slate-600 font-bold cursor-pointer"><i className="fa-solid fa-xmark text-lg"></i></button>
                                </div>
                                <div className="space-y-2 max-h-[60vh] overflow-y-auto pr-1">
                                    {worstRoomsList.map((item, idx) => (
                                        <div key={idx} className={`p-3 rounded-xl border flex items-center justify-between ${idx === 0 ? 'bg-red-50 border-red-300 shadow-sm' : idx < 3 ? 'bg-amber-50 border-amber-200' : 'bg-slate-50 border-slate-200'}`}>
                                            <div className="flex items-center gap-3">
                                                <span className={`w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold ${idx === 0 ? 'bg-red-600 text-white' : idx < 3 ? 'bg-amber-500 text-white' : 'bg-slate-300 text-slate-700'}`}>
                                                    {idx + 1}
                                                </span>
                                                <div>
                                                    <p className="font-bold text-slate-800 text-sm flex items-center gap-1.5">
                                                        Room / Area: {item.room}
                                                        {idx === 0 && <span className="bg-red-600 text-white text-[9px] px-1.5 py-0.5 rounded font-bold animate-pulse">CRITICAL ALERT</span>}
                                                    </p>
                                                    <p className="text-xs text-slate-500">Total Temuan Kerusakan</p>
                                                </div>
                                            </div>
                                            <div className="text-right">
                                                <span className={`text-sm font-bold px-2.5 py-1 rounded-lg ${idx === 0 ? 'bg-red-600 text-white' : 'bg-slate-200 text-slate-800'}`}>
                                                    {item.count} Laporan
                                                </span>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                                <div className="mt-4 pt-3 border-t text-right">
                                    <button onClick={() => setWorstRoomModal(false)} className="bg-[#333b44] hover:bg-[#22272e] text-white px-4 py-2 rounded-xl text-xs font-bold cursor-pointer">Tutup</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* MODAL LAINNYA */}
                    {isModalOpen && (
                        <div className="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center z-50 p-4">
                            <div className="bg-white rounded-2xl max-w-lg w-full p-6 shadow-2xl relative max-h-[90vh] overflow-y-auto">
                                <div className="flex justify-between items-center mb-4 border-b pb-3">
                                    <h3 className="font-bold text-lg text-slate-800 flex items-center gap-2"><i className="fa-solid fa-circle-plus text-[#333b44]"></i> Submit Report Defect</h3>
                                    <button onClick={() => setIsModalOpen(false)} className="text-slate-400 hover:text-slate-600 cursor-pointer"><i className="fa-solid fa-xmark text-lg"></i></button>
                                </div>
                                <div className="bg-slate-100 border border-slate-300 px-4 py-2.5 rounded-lg mb-4 flex justify-between items-center">
                                    <span className="text-xs font-bold text-slate-500 uppercase">No. Tiket:</span>
                                    <span className="font-mono text-lg font-bold text-[#333b44]">{nextFormattedRecordNo}</span>
                                </div>
                                <form onSubmit={handleSubmit} className="space-y-4">
                                    <div className="grid grid-cols-2 gap-3">
                                        <div>
                                            <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">Lantai</label>
                                            <select value={formFloor} onChange={handleFloorChange} className="w-full p-2 border border-slate-300 rounded-lg text-xs bg-white cursor-pointer">
                                                {Array.from(new Set(locationMapping.map(loc => loc.floor))).map(f => <option key={f} value={f}>{f === 'L' ? 'Lobby (L)' : `Lantai ${f}`}</option>)}
                                            </select>
                                        </div>
                                        <div>
                                            <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">Ruangan</label>
                                            <select value={formRoom} onChange={(e) => setFormRoom(e.target.value)} className="w-full p-2 border border-slate-300 rounded-lg text-xs bg-white cursor-pointer">
                                                {availableRooms.map((loc, idx) => <option key={idx} value={loc.room}>{loc.room}</option>)}
                                            </select>
                                        </div>
                                    </div>
                                    <div>
                                        <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">Kategori</label>
                                        <select value={formItem} onChange={(e) => setFormItem(e.target.value)} className="w-full p-2 border border-slate-300 rounded-lg text-xs bg-white cursor-pointer">
                                            {itemList.map((item, idx) => <option key={idx} value={item}>{item}</option>)}
                                        </select>
                                    </div>
                                    <div>
                                        <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">Detail Temuan</label>
                                        <textarea rows="3" value={formNote} onChange={(e) => setFormNote(e.target.value)} placeholder="Jelaskan detail kerusakan..." required className="w-full p-2 border border-slate-300 rounded-lg text-xs focus:outline-none"></textarea>
                                    </div>
                                    <div>
                                        <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">Foto</label>
                                        <input type="file" accept="image/*" onChange={handlePhotoUpload} className="w-full text-xs text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-slate-100 file:text-slate-700 hover:file:bg-slate-200 cursor-pointer" />
                                        {formPhoto && <img src={formPhoto} alt="Preview" className="w-16 h-16 object-cover rounded-lg border mt-2" />}
                                    </div>
                                    <div className="flex justify-end space-x-2 pt-2 border-t">
                                        <button type="button" onClick={() => setIsModalOpen(false)} className="px-3 py-1.5 border rounded-lg text-xs cursor-pointer">Batal</button>
                                        <button type="submit" className="px-3 py-1.5 bg-[#333b44] text-white rounded-lg text-xs cursor-pointer">Kirim Report</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {changePassOpen && (
                        <div className="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center z-50 p-4">
                            <div className="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl relative">
                                <div className="flex justify-between items-center mb-4 border-b pb-3">
                                    <h3 className="font-bold text-base text-slate-800 flex items-center gap-2"><i className="fa-solid fa-key text-amber-600"></i> Ganti Password</h3>
                                    <button onClick={() => { setChangePassOpen(false); setPassMsg({text: '', type: ''}); }} className="text-slate-400 hover:text-slate-600 cursor-pointer"><i className="fa-solid fa-xmark text-lg"></i></button>
                                </div>
                                {passMsg.text && <div className={`p-2.5 rounded-lg text-xs mb-3 ${passMsg.type === 'error' ? 'bg-red-50 text-red-700 border border-red-200' : 'bg-emerald-50 text-emerald-700 border border-emerald-200'}`}>{passMsg.text}</div>}
                                <form onSubmit={handleChangePasswordSubmit} className="space-y-3">
                                    <div>
                                        <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">Password Lama</label>
                                        <input type={showOldPass ? "text" : "password"} value={oldPassInput} onChange={(e) => setOldPassInput(e.target.value)} required className="w-full p-2 border rounded-lg text-xs" />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">Password Baru</label>
                                        <input type={showNewPass ? "text" : "password"} value={newPassInput} onChange={(e) => setNewPassInput(e.target.value)} required className="w-full p-2 border rounded-lg text-xs" />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">Konfirmasi Password</label>
                                        <input type={showConfirmPass ? "text" : "password"} value={confirmPassInput} onChange={(e) => setConfirmPassInput(e.target.value)} required className="w-full p-2 border rounded-lg text-xs" />
                                    </div>
                                    <div className="flex justify-end space-x-2 pt-2 border-t">
                                        <button type="button" onClick={() => setChangePassOpen(false)} className="px-3 py-1.5 border rounded-lg text-xs cursor-pointer">Batal</button>
                                        <button type="submit" className="px-3 py-1.5 bg-[#333b44] text-white rounded-lg text-xs cursor-pointer">Simpan</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {aiModalOpen && (
                        <div className="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center z-50 p-4">
                            <div className="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl relative">
                                <div className="flex justify-between items-center mb-4 border-b pb-3">
                                    <h3 className="font-bold text-base text-slate-800 flex items-center gap-2"><i className="fa-solid fa-wand-magic-sparkles text-amber-600"></i> AI Assistant</h3>
                                    <button onClick={() => setAiModalOpen(false)} className="text-slate-400 hover:text-slate-600 cursor-pointer"><i className="fa-solid fa-xmark text-lg"></i></button>
                                </div>
                                {isAnalyzing ? (
                                    <div className="py-8 text-center space-y-2"><div className="w-6 h-6 border-3 border-slate-600 border-t-transparent rounded-full animate-spin mx-auto"></div><p className="text-xs text-slate-600">Menganalisis temuan...</p></div>
                                ) : (
                                    <div className="space-y-3">
                                        <div className="bg-slate-50 p-3 rounded-xl border text-xs text-slate-800 whitespace-pre-line leading-relaxed">{aiAnalysisResult}</div>
                                        <button onClick={() => setAiModalOpen(false)} className="w-full bg-[#333b44] text-white py-2 rounded-lg text-xs font-medium cursor-pointer">Tutup</button>
                                    </div>
                                )}
                            </div>
                        </div>
                    )}

                    {enlargedPhoto && (
                        <div className="fixed inset-0 bg-black/85 backdrop-blur-sm flex items-center justify-center z-[60] p-4" onClick={() => setEnlargedPhoto(null)}>
                            <div className="relative max-w-4xl max-h-[90vh]">
                                <button className="absolute -top-10 right-0 text-white bg-slate-800/80 px-3 py-1.5 rounded-full text-xs" onClick={() => setEnlargedPhoto(null)}>Tutup ✕</button>
                                <img src={enlargedPhoto} alt="Enlarged" className="max-w-full max-h-[80vh] object-contain rounded-xl border-2 border-slate-500 bg-white" onClick={(e) => e.stopPropagation()} />
                            </div>
                        </div>
                    )}

                    {quickUpdateOpen && (
                        <div className="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center z-50 p-4">
                            <div className="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl relative">
                                <div className="flex justify-between items-center mb-4 border-b pb-3">
                                    <h3 className="font-bold text-base text-slate-800">Update Defect (No. Tiket)</h3>
                                    <button onClick={() => setQuickUpdateOpen(false)} className="text-slate-400 cursor-pointer"><i className="fa-solid fa-xmark text-lg"></i></button>
                                </div>
                                <form onSubmit={handleQuickUpdateSubmit} className="space-y-3">
                                    <div>
                                        <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">Pilih No. Tiket</label>
                                        <select value={quickTicketId} onChange={handleQuickTicketChange} className="w-full p-2 border rounded-lg text-xs bg-white cursor-pointer" required>
                                            <option value="">-- Pilih Tiket --</option>
                                            {defects.map(d => <option key={d.id} value={d.id}>{d.recordNo} - {d.item} ({d.room})</option>)}
                                        </select>
                                    </div>
                                    {quickTicketId && (
                                        <div>
                                            <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">Status Baru</label>
                                            <select value={updateValue} onChange={(e) => setUpdateValue(e.target.value)} className="w-full p-2 border rounded-lg text-xs bg-white cursor-pointer">
                                                {currentUser.dept === 'Eng' ? (
                                                    <><option value="Open">Open</option><option value="Done Progress">Done Progress</option><option value="Resolved">Resolved</option></>
                                                ) : (
                                                    <><option value="Pending">Pending</option><option value="Not Completed">Not Completed</option><option value="Verified">Verified</option></>
                                                )}
                                            </select>
                                        </div>
                                    )}
                                    <div className="flex justify-end space-x-2 pt-2 border-t">
                                        <button type="button" onClick={() => setQuickUpdateOpen(false)} className="px-3 py-1.5 border rounded-lg text-xs cursor-pointer">Batal</button>
                                        <button type="submit" disabled={!quickTicketId} className="px-3 py-1.5 bg-blue-600 text-white rounded-lg text-xs cursor-pointer">Simpan</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
