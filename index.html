                                                </td>
                                                <td className="p-3 text-center">
                                                    <button onClick={() => runAiAnalysis(item)} className="bg-slate-50 hover:bg-slate-100 text-slate-700 border border-slate-300 px-2.5 py-1 rounded-lg text-xs font-semibold flex items-center gap-1 mx-auto transition shadow-sm cursor-pointer">
                                                        <i className="fa-solid fa-wand-magic-sparkles text-amber-600"></i><span>Analyze</span>
                                                    </button>
                                                </td>
                                            </tr>
                                        )) : (
                                            <tr><td colSpan="8" className="p-6 text-center text-slate-500">Tidak ada data defect yang ditemukan.</td></tr>
                                        )}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </main>

                    {/* Modal Submit Report */}
                    {isModalOpen && (
                        <div className="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center z-50 p-4">
                            <div className="bg-white rounded-2xl max-w-lg w-full p-6 shadow-2xl relative max-h-[90vh] overflow-y-auto">
                                <div className="flex justify-between items-center mb-4 border-b pb-3">
                                    <h3 className="font-bold text-lg text-slate-800 flex items-center gap-2">
                                        <i className="fa-solid fa-circle-plus text-[#333b44]"></i> Submit Report Defect
                                    </h3>
                                    <button onClick={() => setIsModalOpen(false)} className="text-slate-400 hover:text-slate-600 font-bold cursor-pointer"><i className="fa-solid fa-xmark text-lg"></i></button>
                                </div>
                                
                                <div className="bg-slate-100 border border-slate-300 px-4 py-2.5 rounded-lg mb-4 flex justify-between items-center shadow-sm">
                                    <span className="text-xs font-bold text-slate-500 uppercase tracking-wider">No. Record Tiket Baru:</span>
                                    <span className="font-mono text-xl font-bold text-[#333b44]">{nextFormattedRecordNo}</span>
                                </div>

                                <form onSubmit={handleSubmit} className="space-y-4">
                                    <div className="grid grid-cols-2 gap-4">
                                        <div>
                                            <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">Pilih Lantai / Area</label>
                                            <select value={formFloor} onChange={handleFloorChange} className="w-full p-2.5 border border-slate-300 rounded-lg text-sm bg-white focus:outline-none font-medium cursor-pointer">
                                                {Array.from(new Set(locationMapping.map(loc => loc.floor))).map(f => (
                                                    <option key={f} value={f}>{f === 'L' ? 'Lobby (L)' : `Lantai ${f}`}</option>
                                                ))}
                                            </select>
                                        </div>
                                        <div>
                                            <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">Ruangan / Lokasi</label>
                                            <select value={formRoom} onChange={(e) => setFormRoom(e.target.value)} className="w-full p-2.5 border border-slate-300 rounded-lg text-sm bg-white focus:outline-none font-medium cursor-pointer">
                                                {availableRooms.map((loc, idx) => <option key={idx} value={loc.room}>{loc.room}</option>)}
                                            </select>
                                        </div>
                                    </div>
                                    <div>
                                        <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">Kategori Kerusakan</label>
                                        <select value={formItem} onChange={(e) => setFormItem(e.target.value)} className="w-full p-2.5 border border-slate-300 rounded-lg text-sm bg-white focus:outline-none cursor-pointer">
                                            {itemList.map((item, idx) => <option key={idx} value={item}>{item}</option>)}
                                        </select>
                                    </div>
                                    <div className="bg-slate-50 p-3 rounded-lg border border-slate-200 grid grid-cols-2 gap-2 text-xs">
                                        <div><span className="text-slate-500 block uppercase font-bold">Pelapor</span><span className="font-semibold text-slate-900">{currentUser.name}</span></div>
                                        <div><span className="text-slate-500 block uppercase font-bold">Departemen</span><span className="font-semibold text-slate-900">{currentUser.dept}</span></div>
                                    </div>
                                    <div>
                                        <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">Detail Temuan</label>
                                        <textarea rows="3" value={formNote} onChange={(e) => setFormNote(e.target.value)} placeholder="Jelaskan detail kerusakan..." required className="w-full p-2.5 border border-slate-300 rounded-lg text-sm focus:outline-none focus:border-slate-500"></textarea>
                                    </div>
                                    <div>
                                        <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">Lampirkan Foto</label>
                                        <div className="flex items-center space-x-3">
                                            <label className="cursor-pointer bg-slate-100 hover:bg-slate-200 border border-slate-300 text-slate-700 px-4 py-2 rounded-lg text-xs font-semibold flex items-center gap-2 transition">
                                                <i className="fa-solid fa-camera"></i><span>Pilih Foto</span>
                                                <input type="file" accept="image/*" onChange={handlePhotoUpload} className="hidden" />
                                            </label>
                                            <span className="text-xs text-slate-500">{formPhoto ? 'Foto siap dilampirkan ✓' : 'Belum ada foto'}</span>
                                        </div>
                                        {formPhoto && <div className="mt-2"><img src={formPhoto} alt="Preview" className="w-20 h-20 object-cover rounded-lg border border-slate-300 shadow-sm" /></div>}
                                    </div>
                                    <div className="flex justify-end space-x-2 pt-2 border-t">
                                        <button type="button" onClick={() => setIsModalOpen(false)} className="px-4 py-2 border border-slate-300 rounded-lg text-sm font-medium text-slate-700 hover:bg-slate-100 cursor-pointer">Batal</button>
                                        <button type="submit" className="px-4 py-2 bg-[#333b44] hover:bg-[#22272e] text-white rounded-lg text-sm font-medium shadow-sm transition cursor-pointer">Kirim Report</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* Modal Ganti Password */}
                    {changePassOpen && (
                        <div className="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center z-50 p-4">
                            <div className="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl relative">
                                <div className="flex justify-between items-center mb-4 border-b pb-3">
                                    <h3 className="font-bold text-lg text-slate-800 flex items-center gap-2">
                                        <i className="fa-solid fa-key text-amber-600"></i> Ganti Password Akun
                                    </h3>
                                    <button onClick={() => { setChangePassOpen(false); setPassMsg({text: '', type: ''}); }} className="text-slate-400 hover:text-slate-600 font-bold cursor-pointer"><i className="fa-solid fa-xmark text-lg"></i></button>
                                </div>

                                {passMsg.text && (
                                    <div className={`p-3 rounded-lg text-xs mb-4 ${passMsg.type === 'error' ? 'bg-red-50 text-red-700 border border-red-200' : 'bg-emerald-50 text-emerald-700 border border-emerald-200'}`}>
                                        {passMsg.text}
                                    </div>
                                )}

                                <form onSubmit={handleChangePasswordSubmit} className="space-y-4">
                                    <div>
                                        <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">Password Lama</label>
                                        <div className="relative">
                                            <input 
                                                type={showOldPass ? "text" : "password"} 
                                                value={oldPassInput} 
                                                onChange={(e) => setOldPassInput(e.target.value)} 
                                                placeholder="Masukkan password saat ini" 
                                                required
                                                className="w-full p-2.5 pr-10 border border-slate-300 rounded-lg text-sm focus:outline-none focus:border-slate-500"
                                            />
                                            <button
                                                type="button"
                                                onClick={() => setShowOldPass(!showOldPass)}
                                                className="absolute right-3 top-3 text-slate-400 hover:text-slate-600 cursor-pointer"
                                            >
                                                <i className={`fa-solid ${showOldPass ? 'fa-eye-slash' : 'fa-eye'}`}></i>
                                            </button>
                                        </div>
                                    </div>

                                    <div>
                                        <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">Password Baru</label>
                                        <div className="relative">
                                            <input 
                                                type={showNewPass ? "text" : "password"} 
                                                value={newPassInput} 
                                                onChange={(e) => setNewPassInput(e.target.value)} 
                                                placeholder="Minimal 6 karakter" 
                                                required
                                                className="w-full p-2.5 pr-10 border border-slate-300 rounded-lg text-sm focus:outline-none focus:border-slate-500"
                                            />
                                            <button
                                                type="button"
                                                onClick={() => setShowNewPass(!showNewPass)}
                                                className="absolute right-3 top-3 text-slate-400 hover:text-slate-600 cursor-pointer"
                                            >
                                                <i className={`fa-solid ${showNewPass ? 'fa-eye-slash' : 'fa-eye'}`}></i>
                                            </button>
                                        </div>
                                    </div>

                                    <div>
                                        <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">Konfirmasi Password Baru</label>
                                        <div className="relative">
                                            <input 
                                                type={showConfirmPass ? "text" : "password"} 
                                                value={confirmPassInput} 
                                                onChange={(e) => setConfirmPassInput(e.target.value)} 
                                                placeholder="Ulangi password baru" 
                                                required
                                                className="w-full p-2.5 pr-10 border border-slate-300 rounded-lg text-sm focus:outline-none focus:border-slate-500"
                                            />
                                            <button
                                                type="button"
                                                onClick={() => setShowConfirmPass(!showConfirmPass)}
                                                className="absolute right-3 top-3 text-slate-400 hover:text-slate-600 cursor-pointer"
                                            >
                                                <i className={`fa-solid ${showConfirmPass ? 'fa-eye-slash' : 'fa-eye'}`}></i>
                                            </button>
                                        </div>
                                    </div>

                                    <div className="flex justify-end space-x-2 pt-2 border-t">
                                        <button 
                                            type="button" 
                                            onClick={() => { setChangePassOpen(false); setPassMsg({text: '', type: ''}); }} 
                                            className="px-4 py-2 border border-slate-300 rounded-lg text-sm font-medium text-slate-700 hover:bg-slate-100 cursor-pointer"
                                        >
                                            Batal
                                        </button>
                                        <button 
                                            type="submit" 
                                            className="px-4 py-2 bg-[#333b44] hover:bg-[#22272e] text-white rounded-lg text-sm font-medium shadow-sm transition cursor-pointer"
                                        >
                                            Simpan Password
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* Modal AI Assist */}
                    {aiModalOpen && (
                        <div className="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center z-50 p-4">
                            <div className="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl relative">
                                <div className="flex justify-between items-center mb-4 border-b pb-3">
                                    <h3 className="font-bold text-lg text-slate-800 flex items-center gap-2">
                                        <i className="fa-solid fa-wand-magic-sparkles text-amber-600"></i> Erian AI Assistant
                                    </h3>
                                    <button onClick={() => setAiModalOpen(false)} className="text-slate-400 hover:text-slate-600 font-bold cursor-pointer"><i className="fa-solid fa-xmark text-lg"></i></button>
                                </div>
                                {isAnalyzing ? (
                                    <div className="py-10 text-center space-y-3">
                                        <div className="w-8 h-8 border-4 border-slate-600 border-t-transparent rounded-full animate-spin mx-auto"></div>
                                        <p className="text-sm text-slate-600 font-medium">Menganalisis spesifik temuan kerusakan...</p>
                                    </div>
                                ) : (
                                    <div className="space-y-4">
                                        <div className="bg-slate-50 p-4 rounded-xl border border-slate-200 text-sm text-slate-800 whitespace-pre-line leading-relaxed font-sans">{aiAnalysisResult}</div>
                                        <button onClick={() => setAiModalOpen(false)} className="w-full bg-[#333b44] hover:bg-[#22272e] text-white py-2 rounded-lg text-sm font-medium transition shadow-sm cursor-pointer">Tutup</button>
                                    </div>
                                )}
                            </div>
                        </div>
                    )}

                    {/* Modal Zoom Foto */}
                    {enlargedPhoto && (
                        <div className="fixed inset-0 bg-black/85 backdrop-blur-sm flex items-center justify-center z-[60] p-4" onClick={() => setEnlargedPhoto(null)}>
                            <div className="relative max-w-5xl max-h-[90vh] flex flex-col items-center animate-in fade-in zoom-in duration-200">
                                <button className="absolute -top-12 right-0 text-white hover:text-slate-300 font-bold flex items-center gap-2 bg-slate-800/60 px-4 py-2 rounded-full transition cursor-pointer" onClick={() => setEnlargedPhoto(null)}>
                                    <i className="fa-solid fa-xmark"></i> Tutup Foto
                                </button>
                                <img src={enlargedPhoto} alt="Enlarged Defect" className="max-w-full max-h-[85vh] object-contain rounded-xl shadow-2xl border-2 border-slate-500 bg-white" onClick={(e) => e.stopPropagation()} />
                            </div>
                        </div>
                    )}

                    {/* Modal Quick Update Ticket */}
                    {quickUpdateOpen && (
                        <div className="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center z-50 p-4">
                            <div className="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl relative">
                                <div className="flex justify-between items-center mb-4 border-b pb-3">
                                    <h3 className="font-bold text-lg text-slate-800 flex items-center gap-2">
                                        <i className={`fa-solid fa-circle-check ${currentUser.dept === 'Eng' ? 'text-blue-600' : 'text-emerald-600'}`}></i> 
                                        Update Defect (Berdasarkan No. Tiket)
                                    </h3>
                                    <button onClick={() => {setQuickUpdateOpen(false); setQuickTicketId('');}} className="text-slate-400 hover:text-slate-600 font-bold cursor-pointer"><i className="fa-solid fa-xmark text-lg"></i></button>
                                </div>
                                
                                <form onSubmit={handleQuickUpdateSubmit} className="space-y-4">
                                    <div>
                                        <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">
                                            Pilih Nomor Tiket (No. Record)
                                        </label>
                                        <select 
                                            value={quickTicketId} 
                                            onChange={handleQuickTicketChange} 
                                            className="w-full p-2.5 border border-slate-300 rounded-lg text-sm bg-white focus:outline-none focus:border-slate-500 font-medium cursor-pointer"
                                            required
                                        >
                                            <option value="">-- Silakan Pilih Tiket --</option>
                                            {defects
                                                .filter(d => currentUser.dept === 'Eng' ? d.statusEng !== 'Resolved' : d.checkHK !== 'Verified')
                                                .map(d => (
                                                <option key={d.id} value={d.id}>{d.recordNo} - {d.item} ({d.room})</option>
                                            ))}
                                        </select>
                                    </div>

                                    {quickTicketId && defects.find(d => d.id === quickTicketId) && (
                                        <div className="bg-slate-100 border border-slate-300 px-4 py-3 rounded-lg shadow-sm">
                                            <div className="text-sm text-slate-700 space-y-1">
                                                <p><span className="font-semibold text-slate-900">Pelapor:</span> {defects.find(d => d.id === quickTicketId).name}</p>
                                                <p><span className="font-semibold text-slate-900">Lokasi:</span> {defects.find(d => d.id === quickTicketId).floor === 'L' ? 'Lobby' : `Lantai ${defects.find(d => d.id === quickTicketId).floor}`} - {defects.find(d => d.id === quickTicketId).room}</p>
                                                <p><span className="font-semibold text-slate-900">Catatan:</span> {defects.find(d => d.id === quickTicketId).note || '-'}</p>
                                            </div>
                                        </div>
                                    )}

                                    {quickTicketId && (
                                        <div>
                                            <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">
                                                Update {currentUser.dept === 'Eng' ? 'Status Defect (Eng)' : 'Verifikasi Kebersihan (HK)'}
                                            </label>
                                            <select 
                                                value={updateValue} 
                                                onChange={(e) => setUpdateValue(e.target.value)} 
                                                className={`w-full p-2.5 border rounded-lg text-sm bg-white focus:outline-none font-medium cursor-pointer ${currentUser.dept === 'Eng' ? 'border-blue-300 focus:border-blue-500' : 'border-emerald-300 focus:border-emerald-500'}`}
                                            >
                                                {currentUser.dept === 'Eng' ? (
                                                    <>
                                                        <option value="Open">Open</option>
                                                        <option value="Done Progress">Done Progress</option>
                                                        <option value="Resolved">Resolved</option>
                                                    </>
                                                ) : (
                                                    <>
                                                        <option value="Pending">Pending Check</option>
                                                        <option value="Not Completed">Not Completed</option>
                                                        <option value="Verified">Verified Clean</option>
                                                    </>
                                                )}
                                            </select>
                                        </div>
                                    )}
                                    
                                    <div className="flex justify-end space-x-2 pt-4 border-t">
                                        <button type="button" onClick={() => {setQuickUpdateOpen(false); setQuickTicketId('');}} className="px-4 py-2 border border-slate-300 rounded-lg text-sm font-medium text-slate-700 hover:bg-slate-100 cursor-pointer">Batal</button>
                                        <button type="submit" disabled={!quickTicketId} className={`px-4 py-2 text-white rounded-lg text-sm font-medium shadow-sm transition ${!quickTicketId ? 'bg-slate-400 cursor-not-allowed' : currentUser.dept === 'Eng' ? 'bg-blue-600 hover:bg-blue-700 cursor-pointer' : 'bg-emerald-600 hover:bg-emerald-700 cursor-pointer'}`}>
                                            Simpan Update
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
