                  <label className="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1">Email Google</label>
                  <div className="relative">
                    <span className="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-400">
                      <i className="fa-solid fa-envelope"></i>
                    </span>
                    <input 
                      type="email" 
                      required
                      className="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white"
                      placeholder="nama.staff@gmail.com"
                      value={authEmailInput}
                      onChange={(e) => setAuthEmailInput(e.target.value)}
                    />
                  </div>
                </div>

                <div>
                  <label className="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1">Password</label>
                  <div className="relative">
                    <span className="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-400">
                      <i className="fa-solid fa-lock"></i>
                    </span>
                    <input 
                      type={showLoginPass ? "text" : "password"} 
                      required
                      className="w-full pl-10 pr-12 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white"
                      placeholder="••••••••"
                      value={authPasswordInput}
                      onChange={(e) => setAuthPasswordInput(e.target.value)}
                    />
                    <button 
                      type="button"
                      onClick={() => setShowLoginPass(!showLoginPass)}
                      className="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-slate-600 focus:outline-none"
                    >
                      <i className={`fa-solid ${showLoginPass ? 'fa-eye-slash' : 'fa-eye'}`}></i>
                    </button>
                  </div>
                </div>

                <button 
                  type="submit"
                  className="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-xl text-sm shadow-lg shadow-blue-200 transition duration-200"
                >
                  Masuk Aplikasi
                </button>
              </form>

              <div className="mt-6 text-center">
                <button 
                  onClick={() => { setRegisterModalOpen(true); setRegMsg({text:'', type:''}); }}
                  className="text-xs text-blue-600 hover:underline font-medium"
                >
                  + Daftarkan Email Staff Baru (Akses Submit)
                </button>
              </div>
            </div>

            {registerModalOpen && (
              <div className="fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                <div className="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl border border-slate-200">
                  <div className="flex justify-between items-center mb-4">
                    <h3 className="text-lg font-bold text-slate-800">Daftar Akun Staff (Akses Submit)</h3>
                    <button onClick={() => setRegisterModalOpen(false)} className="text-slate-400 hover:text-slate-600">
                      <i className="fa-solid fa-xmark text-lg"></i>
                    </button>
                  </div>

                  {regMsg.text && (
                    <div className={`mb-4 p-3 rounded-xl text-sm ${regMsg.type === 'error' ? 'bg-red-50 text-red-700 border border-red-200' : 'bg-green-50 text-green-700 border border-green-200'}`}>
                      {regMsg.text}
                    </div>
                  )}

                  <form onSubmit={handleRegisterStaffSubmit} className="space-y-3">
                    <div>
                      <label className="block text-xs font-semibold text-slate-600 mb-1">Nama Lengkap & Jabatan</label>
                      <input 
                        type="text" 
                        required 
                        placeholder="Contoh: Rian (Front Desk)"
                        className="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
                        value={newStaffName}
                        onChange={(e) => setNewStaffName(e.target.value)}
                      />
                    </div>
                    <div>
                      <label className="block text-xs font-semibold text-slate-600 mb-1">Email Google Aktif</label>
                      <input 
                        type="email" 
                        required 
                        placeholder="staff.erian@gmail.com"
                        className="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
                        value={newStaffEmail}
                        onChange={(e) => setNewStaffEmail(e.target.value)}
                      />
                    </div>
                    <div>
                      <label className="block text-xs font-semibold text-slate-600 mb-1">Departemen</label>
                      <select 
                        className="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
                        value={newStaffDept}
                        onChange={(e) => setNewStaffDept(e.target.value)}
                      >
                        <option value="FO">Front Office (FO)</option>
                        <option value="HK">Housekeeping (HK)</option>
                        <option value="Eng">Engineering (Eng)</option>
                        <option value="FBS">F&B Service (FBS)</option>
                        <option value="FBP">F&B Product (FBP)</option>
                        <option value="CA">Accounting (CA)</option>
                        <option value="Sales">Sales & Marketing</option>
                        <option value="IT">IT</option>
                      </select>
                    </div>
                    <div>
                      <label className="block text-xs font-semibold text-slate-600 mb-1">Buat Password</label>
                      <div className="relative">
                        <input 
                          type={showNewStaffPass ? "text" : "password"} 
                          required 
                          placeholder="Min. 6 karakter"
                          className="w-full pl-3 pr-10 py-2 bg-slate-50 border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
                          value={newStaffPass}
                          onChange={(e) => setNewStaffPass(e.target.value)}
                        />
                        <button 
                          type="button"
                          onClick={() => setShowNewStaffPass(!showNewStaffPass)}
                          className="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-slate-600"
                        >
                          <i className={`fa-solid ${showNewStaffPass ? 'fa-eye-slash' : 'fa-eye'}`}></i>
                        </button>
                      </div>
                    </div>
                    <div className="pt-2">
                      <button 
                        type="submit"
                        className="w-full py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-xl text-sm shadow transition"
                      >
                        Simpan & Berikan Akses Submit
                      </button>
                    </div>
                  </form>
                </div>
              </div>
            )}
          </div>
        );
      }

      return (
        <div className="min-h-screen bg-slate-100 flex flex-col">
          <header className="bg-slate-900 text-white shadow-md">
            <div className="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
              <div className="flex items-center space-x-3">
                <div className="bg-blue-600 text-white w-9 h-9 rounded-xl flex items-center justify-center font-bold">E</div>
                <div>
                  <h1 className="font-bold text-base leading-tight">Erian Defect Tracker</h1>
                  <p className="text-xs text-slate-400">Login as: <span className="text-blue-400 font-medium">{currentUser.name}</span> ({currentUser.email})</p>
                </div>
              </div>
              <div className="flex items-center space-x-2">
                <button 
                  onClick={() => { setChangePassOpen(true); setPassMsg({text:'', type:''}); }}
                  className="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-xs font-medium rounded-lg text-slate-200 transition"
                >
                  <i className="fa-solid fa-key mr-1.5"></i> Ganti Password
                </button>
                <button 
                  onClick={handleLogout}
                  className="px-3 py-1.5 bg-red-600/20 hover:bg-red-600 text-xs font-medium rounded-lg text-red-300 hover:text-white transition"
                >
                  <i className="fa-solid fa-right-from-bracket mr-1.5"></i> Keluar
                </button>
              </div>
            </div>
          </header>

          <main className="max-w-7xl mx-auto px-4 py-6 w-full flex-1">
            <div className="bg-white rounded-2xl p-6 shadow-sm border border-slate-200 mb-6">
              <div className="flex flex-col md:flex-row md:items-center justify-between gap-4">
                <div>
                  <h2 className="text-xl font-bold text-slate-800">Selamat Datang, {currentUser.name}!</h2>
                  <p className="text-sm text-slate-500 mt-0.5">
                    Total Defect Tercatat Saat Ini: <span className="font-semibold text-blue-600">EPF-{String(defects.length).padStart(6, '0')}</span> (Siap lanjut ke baris berikutnya).
                  </p>
                </div>
                <div className="flex items-center gap-2">
                  <span className="px-3 py-1 bg-blue-50 text-blue-700 text-xs font-semibold rounded-full border border-blue-200">
                    Dept: {currentUser.dept}
                  </span>
                  <span className="px-3 py-1 bg-emerald-50 text-emerald-700 text-xs font-semibold rounded-full border border-emerald-200">
                    Sistem Aktif & Terhubung
                  </span>
                </div>
              </div>
            </div>

            <div className="bg-white rounded-2xl p-6 shadow-sm border border-slate-200">
              <div className="flex justify-between items-center mb-4">
                <h3 className="font-bold text-slate-800 text-lg">Modul Input & Monitoring Defect Hotel</h3>
              </div>
              <p className="text-sm text-slate-600">
                Data defect tersinkronisasi otomatis dengan Google Sheet. Staff yang baru didaftarkan dapat melakukan submit laporan dengan aman.
              </p>
            </div>
          </main>

          {changePassOpen && (
            <div className="fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl border border-slate-200">
                <div className="flex justify-between items-center mb-4">
                  <h3 className="text-lg font-bold text-slate-800">Ubah Password Akun</h3>
                  <button onClick={() => setChangePassOpen(false)} className="text-slate-400 hover:text-slate-600">
                    <i className="fa-solid fa-xmark text-lg"></i>
                  </button>
                </div>

                {passMsg.text && (
                  <div className={`mb-4 p-3 rounded-xl text-sm ${passMsg.type === 'error' ? 'bg-red-50 text-red-700 border border-red-200' : 'bg-green-50 text-green-700 border border-green-200'}`}>
                    {passMsg.text}
                  </div>
                )}

                <form onSubmit={handleChangePasswordSubmit} className="space-y-3">
                  <div>
                    <label className="block text-xs font-semibold text-slate-600 mb-1">Password Lama</label>
                    <div className="relative">
                      <input 
                        type={showOldPass ? "text" : "password"} 
                        required 
                        className="w-full pl-3 pr-10 py-2 bg-slate-50 border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
                        value={oldPassInput}
                        onChange={(e) => setOldPassInput(e.target.value)}
                      />
                      <button 
                        type="button"
                        onClick={() => setShowOldPass(!showOldPass)}
                        className="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-slate-600"
                      >
                        <i className={`fa-solid ${showOldPass ? 'fa-eye-slash' : 'fa-eye'}`}></i>
                      </button>
                    </div>
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-slate-600 mb-1">Password Baru (Min. 6 Karakter)</label>
                    <div className="relative">
                      <input 
                        type={showNewPass ? "text" : "password"} 
                        required 
                        className="w-full pl-3 pr-10 py-2 bg-slate-50 border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
                        value={newPassInput}
                        onChange={(e) => setNewPassInput(e.target.value)}
                      />
                      <button 
                        type="button"
                        onClick={() => setShowNewPass(!showNewPass)}
                        className="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-slate-600"
                      >
                        <i className={`fa-solid ${showNewPass ? 'fa-eye-slash' : 'fa-eye'}`}></i>
                      </button>
                    </div>
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-slate-600 mb-1">Konfirmasi Password Baru</label>
                    <div className="relative">
                      <input 
                        type={showConfirmPass ? "text" : "password"} 
                        required 
                        className="w-full pl-3 pr-10 py-2 bg-slate-50 border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
                        value={confirmPassInput}
                        onChange={(e) => setConfirmPassInput(e.target.value)}
                      />
                      <button 
                        type="button"
                        onClick={() => setShowConfirmPass(!showConfirmPass)}
                        className="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-slate-600"
                      >
                        <i className={`fa-solid ${showConfirmPass ? 'fa-eye-slash' : 'fa-eye'}`}></i>
                      </button>
                    </div>
                  </div>

                  <div className="pt-2">
                    <button 
                      type="submit"
                      className="w-full py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-xl text-sm shadow transition"
                    >
                      Perbarui Password
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
