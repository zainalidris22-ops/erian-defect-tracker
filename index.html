<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Erian Defect Tracker</title>
    <!-- Masukkan seluruh kode HTML, CSS, dan JS aplikasi Anda di sini -->
    <script>
        // URL Endpoint Google Apps Script yang baru dan aktif
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw0vJDSo5IfH_s2SJC6Vg6tE-4Kk-rkdZjhblLFXNFs8i-Ei18heaShkyw6TRZC_huATg/exec";

        // Contoh fungsi pengiriman data (pastikan disesuaikan dengan fungsi submit di kode Anda)
        function sendDataToSheet(dataPayload) {
            fetch(SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                cache: 'no-cache',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(dataPayload)
            })
            .then(response => {
                alert("Laporan berhasil dikirim dan disinkronkan ke Google Sheets!");
                location.reload();
            })
            .catch(error => {
                console.error("Error:", error);
                alert("Gagal mengirim data. Periksa koneksi internet.");
            });
        }
    </script>
</head>
<body>
    <h1>Erian Defect Tracker - Live Sync</h1>
    <p>Silakan gunakan halaman utama aplikasi Anda yang sudah terintegrasi dengan script terbaru.</p>
</body>
</html>
